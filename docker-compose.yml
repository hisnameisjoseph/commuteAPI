# Local SQL Server for development. Production uses Azure SQL.
# Copy .env.example to .env and set MSSQL_SA_PASSWORD before running `docker compose up -d`.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # No native arm64 image exists; Docker Desktop runs it under Rosetta on Apple silicon.
    platform: linux/amd64
    container_name: commuteapi-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
